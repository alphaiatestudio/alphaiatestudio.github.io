<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alphaiate Studio</title>
<meta name="description" content="Veja os trabalhos iniciais de uma tripulação digital que produz jogos com criatividade humana e inteligência de máquina. Bem vindo ao Alphaiate, um estúdio que flutua plenamente nas ondas internéticas às praias do Github.">
<meta property="og:title" content="Alphaiate Studio">
<meta property="og:description" content="Veja os trabalhos iniciais de uma tripulação digital que produz jogos com criatividade humana e inteligência de máquina. Bem vindo ao Alphaiate, um estúdio que flutua plenamente nas ondas internéticas às praias do Github.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0b1220">
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="ponte">

<div class="bg" id="bgA" aria-hidden="true"></div>
<div class="bg" id="bgB" aria-hidden="true"></div>
<div class="veil" aria-hidden="true"></div>

<header class="top">
  <a class="brand" href="#inicio" aria-label="Alphaiate Studio">ALPHAIATE <span>STUDIO</span></a>

  <nav class="langs" aria-label="Idioma / Language / Idioma">
    <button type="button" data-lang="pt" aria-pressed="true" lang="pt">
      <svg viewBox="0 0 28 20" aria-hidden="true"><rect width="28" height="20" fill="#009b3a"/><path d="M14 2 26 10 14 18 2 10Z" fill="#ffdf00"/><circle cx="14" cy="10" r="4.2" fill="#002776"/></svg>
      <span>Português</span>
    </button>
    <button type="button" data-lang="en" aria-pressed="false" lang="en">
      <svg viewBox="0 0 60 30" aria-hidden="true"><clipPath id="fs"><path d="M0,0 v30 h60 v-30 z"/></clipPath><clipPath id="ft"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><g clip-path="url(#fs)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#ft)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></g></svg>
      <span>English</span>
    </button>
    <button type="button" data-lang="es" aria-pressed="false" lang="es">
      <svg viewBox="0 0 3 2" aria-hidden="true"><rect width="3" height="2" fill="#c60b1e"/><rect y=".5" width="3" height="1" fill="#ffc400"/></svg>
      <span>Español</span>
    </button>
    <button type="button" data-lang="zh" aria-pressed="false" lang="zh-Hans">
      <span class="lang-glyph" aria-hidden="true">文</span>
      <span>中文</span>
    </button>
  </nav>
</header>

<main id="inicio">
  <section class="hero">
    <h1>ALPHAIATE <span>STUDIO</span></h1>
    <p class="tagline" data-i18n="tagline"></p>
    <div class="cta">
      <a class="btn primary" id="ctaPlay" href="#" data-i18n="cta_play"></a>
      <button type="button" class="btn ghost" id="ctaStudio" data-i18n="cta_studio"></button>
    </div>
  </section>

  <section class="games" aria-labelledby="gamesTitle">
    <h2 id="gamesTitle" data-i18n="games_title"></h2>
    <div class="grid">

      <article class="card featured" data-game="mining">
        <div class="shot" data-shot="mining"></div>
        <div class="body">
          <span class="tag" data-i18n="mining_tag"></span>
          <h3>Mining the Moon: Lunar Corps</h3>
          <p data-i18n="mining_desc"></p>
          <div class="row">
            <a class="btn primary" data-play="mining" href="#" data-i18n="btn_play"></a>
            <button type="button" class="btn ghost" data-preview="mining" data-i18n="btn_preview"></button>
          </div>
        </div>
      </article>


      <article class="card" data-game="snakes3d">
        <div class="shot" data-shot="snakes3d"></div>
        <div class="body">
          <span class="tag" data-i18n="snakes3d_tag"></span>
          <h3>SNAKES NEON 3D</h3>
          <p data-i18n="snakes3d_desc"></p>
          <div class="row">
            <a class="btn primary" data-play="snakes3d" href="#" data-i18n="btn_play"></a>
            <a class="btn ghost" href="snakes-neon-3d-v2.9.2.apk" download data-i18n="btn_apk"></a>
            <button type="button" class="btn ghost" data-preview="snakes3d" data-i18n="btn_preview"></button>
          </div>
          <p class="note" data-i18n="snakes3d_apk_note"></p>
        </div>
      </article>

      <article class="card studio">
        <div class="shot" data-shot="studio"></div>
        <div class="body">
          <span class="tag" data-i18n="studio_tag"></span>
          <h3 data-i18n="studio_title"></h3>
          <p data-i18n="studio_desc"></p>
          <div class="row">
            <button type="button" class="btn primary" id="cardStudio" data-i18n="cta_studio"></button>
          </div>
        </div>
      </article>

    </div>
  </section>
</main>

<footer class="foot">
  <div class="theme" role="group" aria-labelledby="themeLabel">
    <span id="themeLabel" data-i18n="theme_label"></span>
    <button type="button" data-theme-mode="auto" aria-pressed="true" data-i18n="t_auto"></button>
    <button type="button" data-theme-mode="noite" aria-pressed="false" data-i18n="t_noite"></button>
    <button type="button" data-theme-mode="dia" aria-pressed="false" data-i18n="t_dia"></button>
    <button type="button" data-theme-mode="ponte" aria-pressed="false" data-i18n="t_ponte"></button>
  </div>
  <p class="now" id="nowTheme" aria-live="polite"></p>
  <p class="small"><span data-i18n="foot_made"></span> · <a href="https://github.com/alphaiatestudio" rel="noopener">GitHub</a> · <a href="privacidade.html" data-i18n="foot_privacy"></a></p>
</footer>

<!-- Janela flutuante de prévia (captura real do jogo) -->
<dialog id="previewDlg" aria-labelledby="pvTitle">
  <div class="dlg">
    <button type="button" class="x" id="pvClose" aria-label="Fechar">×</button>
    <h3 id="pvTitle"></h3>
    <p class="real" data-i18n="real_shot"></p>
    <div class="stage" id="pvStage"></div>
    <div class="thumbs" id="pvThumbs"></div>
    <div class="row">
      <a class="btn primary" id="pvPlay" href="#" data-i18n="btn_play"></a>
      <button type="button" class="btn ghost" id="pvClose2" data-i18n="close"></button>
    </div>
  </div>
</dialog>

<!-- Pop-up da senha do navio -->
<dialog id="pwDlg" aria-labelledby="pwTitle">
  <form class="dlg" id="pwForm" method="dialog" novalidate>
    <button type="button" class="x" id="pwClose" aria-label="Fechar">×</button>
    <h3 id="pwTitle" data-i18n="pw_title"></h3>
    <p data-i18n="pw_desc"></p>
    <label class="sr" for="pwInput" data-i18n="pw_title"></label>
    <input id="pwInput" type="password" autocomplete="off" data-i18n-ph="pw_ph">
    <p class="err" id="pwErr" role="alert"></p>
    <div class="row">
      <button type="submit" class="btn primary" data-i18n="pw_btn"></button>
    </div>
  </form>
</dialog>

<script src="aia-track.js"></script>
<script src="app.js"></script>
</body>
</html>
