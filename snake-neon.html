<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Neon</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(ellipse at top, #141428 0%, #0a0a12 60%);
    color: #eee;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }
  h1 {
    font-size: 30px;
    letter-spacing: 8px;
    background: linear-gradient(90deg, #0ff, #f0f, #ff0, #0ff);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 10px rgba(0,255,255,.6));
    animation: titleShift 6s linear infinite;
    margin-bottom: 10px;
  }
  @keyframes titleShift { to { background-position: 300% 0; } }
  #hud {
    display: flex;
    gap: 28px;
    margin-bottom: 10px;
    font-size: 15px;
    align-items: center;
  }
  #hud span {
    padding: 4px 14px;
    border-radius: 20px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.1);
  }
  #hud .score { color: #0f0; text-shadow: 0 0 8px #0f0; }
  #hud .hiscore { color: #f0f; text-shadow: 0 0 8px #f0f; }
  #hud .powerup { color: #ff0; text-shadow: 0 0 8px #ff0; border: none; background: none; }
  canvas {
    touch-action: none; /* libera o swipe sem rolar a página */
    border: 3px solid #0ff;
    border-radius: 12px;
    box-shadow: 0 0 30px rgba(0,255,255,.35), 0 12px 40px rgba(0,0,0,.6), inset 0 0 30px rgba(0,255,255,.06);
    background: #05050a;
  }
  #controls { margin-top: 10px; font-size: 12px; color: #777; text-align: center; }
  button {
    background: linear-gradient(180deg, rgba(0,255,255,.12), rgba(0,255,255,.02));
    border: 1px solid #0ff;
    border-radius: 8px;
    color: #0ff;
    font-family: inherit;
    font-weight: bold;
    padding: 8px 20px;
    margin: 10px 4px 0;
    cursor: pointer;
    text-shadow: 0 0 6px #0ff;
    transition: transform .1s, box-shadow .1s;
  }
  button:hover { box-shadow: 0 0 14px rgba(0,255,255,.5); transform: translateY(-1px); }
  button:active { transform: translateY(1px); }
  #menu {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(5,5,10,.92);
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #menu .panel {
    border: 2px solid #f0f;
    border-radius: 14px;
    box-shadow: 0 0 30px rgba(255,0,255,.4);
    padding: 24px 32px;
    background: #0c0c18;
    max-height: 90vh;
    overflow-y: auto;
  }
  #menu h2 { color: #f0f; text-shadow: 0 0 10px #f0f; margin-bottom: 16px; letter-spacing: 3px; }
  #menu label { display: flex; justify-content: space-between; gap: 24px; margin: 10px 0; font-size: 14px; align-items: center; }
  #menu input[type=range] { width: 140px; accent-color: #0ff; }
  #menu input[type=color] { width: 48px; height: 28px; background: none; border: 1px solid #444; cursor: pointer; }
  #menu select, #menu input[type=number] {
    background: #111; color: #0ff; border: 1px solid #0ff; border-radius: 5px; font-family: inherit; padding: 2px 6px;
  }
  #menu .val { color: #ff0; min-width: 36px; text-align: right; }
</style>
</head>
<body>
<h1>SNAKE NEON</h1>
<div id="hud">
  <span class="score">PONTOS: <b id="score">0</b></span>
  <span class="hiscore">RECORDE: <b id="hiscore">0</b></span>
  <span class="powerup" id="powerupLabel"></span>
</div>
<canvas id="game"></canvas>
<div>
  <button id="btnStart">JOGAR (Espaço)</button>
  <button id="btnMenu">OPÇÕES (M)</button>
</div>
<div id="controls">Setas/WASD ou deslize o dedo (swipe) para mover · Espaço ou toque = pausa/início · M = opções</div>

<div id="menu">
  <div class="panel">
    <h2>OPÇÕES</h2>
    <label>Velocidade <span><input type="range" id="optSpeed" min="3" max="20" step="1"> <span class="val" id="optSpeedVal"></span></span></label>
    <label>Tamanho do grid <span><input type="range" id="optGrid" min="10" max="40" step="2"> <span class="val" id="optGridVal"></span></span></label>
    <label>Paredes <select id="optWalls">
      <option value="wrap">Teleporta (atravessa)</option>
      <option value="solid">Sólidas (game over)</option>
    </select></label>
    <label>Sons <select id="optSound">
      <option value="true">Ligados</option>
      <option value="false">Desligados</option>
    </select></label>
    <label>Obstáculos <select id="optObstacles">
      <option value="true">Ligados</option>
      <option value="false">Desligados</option>
    </select></label>
    <label>Qtd. de obstáculos <span><input type="range" id="optObstacleCount" min="2" max="30" step="1"> <span class="val" id="optObstacleCountVal"></span></span></label>
    <label>Power-ups <select id="optPowerups">
      <option value="true">Ligados</option>
      <option value="false">Desligados</option>
    </select></label>
    <label>Chance de power-up (%) <span><input type="range" id="optPowerChance" min="5" max="50" step="5"> <span class="val" id="optPowerChanceVal"></span></span></label>
    <label>Cor da cobra <input type="color" id="optSnakeColor"></label>
    <label>Tamanho inicial <input type="number" id="optStartLen" min="1" max="10" style="width:60px"></label>
    <div style="text-align:center">
      <button id="btnSave">SALVAR</button>
      <button id="btnReset">PADRÃO</button>
      <button id="btnClose">FECHAR</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   CONFIG — personalize o jogo aqui! (low code)
   Tudo abaixo pode ser alterado sem mexer na lógica do jogo.
   O menu de OPÇÕES no jogo sobrescreve esses valores e salva
   no navegador (localStorage). "PADRÃO" volta para estes.
   ============================================================ */
const CONFIG = {
  gridSize: 24,          // nº de células no grid (10 a 40)
  cellPx: 24,            // tamanho de cada célula em pixels
  speed: 8,              // velocidade: passos por segundo (3 a 20)
  walls: "wrap",         // "wrap" = teleporta pro outro lado · "solid" = bater mata
  startLength: 3,        // tamanho inicial da cobra
  growPerFood: 1,        // quanto a cobra cresce por comida

  // Power-ups
  powerupsEnabled: true, // true/false — liga/desliga power-ups
  powerupChance: 0.25,   // chance (0 a 1) de nascer um power-up junto da comida
  powerupDuration: 5,    // duração dos efeitos em segundos
  powerupLifetime: 8,    // segundos até o power-up sumir do mapa

  // Pontuação
  foodPoints: 10,        // pontos base por fruta (frutas raras valem mais!)
  bonusPoints: 50,       // pontos do power-up de estrela

  // Sons (efeitos retrô gerados pelo navegador, sem arquivos)
  soundEnabled: true,    // true/false — liga/desliga os sons
  soundVolume: 0.15,     // volume de 0 a 1

  // Obstáculos (pedras no mapa — bater nelas é game over,
  // exceto no modo fantasma, que atravessa)
  obstaclesEnabled: true,
  obstacleCount: 8,      // quantidade de pedras

  // Frutas: cada uma tem cor, multiplicador de pontos e raridade
  // (weight maior = aparece mais). Adicione ou remova à vontade!
  fruits: [
    { name: "maçã",    kind: "apple",  mult: 1, weight: 5 },
    { name: "cereja",  kind: "cherry", mult: 2, weight: 3 },
    { name: "uva",     kind: "grape",  mult: 3, weight: 2 },
    { name: "dourada", kind: "golden", mult: 5, weight: 1 },
  ],

  // Cores
  colors: {
    snakeBody: "#2ecc40",   // corpo da cobra (verde cartoon)
    snakeBelly: "#b8f5a0",  // barriga clara
    grid:      "#11112255", // linhas do tabuleiro
    obstacle:  "#8a7f70",   // pedras
  },

  // Defina seus próprios power-ups! type: speed | slow | bonus | ghost
  powerupTypes: ["speed", "slow", "bonus", "ghost"],
};
/* ===================== fim do CONFIG ===================== */

// --- Estado ---
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let cfg = loadConfig();
let snake, prevSnake, dir, nextDir, food, powerup, growth, score, running, paused, dead, obstacles = [];
let stepTimer = 0, stepInterval = 1, lastTime = 0, effect = null, effectTimer = 0, powerupTimer = 0;
let particles = [], shake = 0, deathFlash = 0;
let hiscore = +(localStorage.getItem("snakeNeonHiscore") || 0);
document.getElementById("hiscore").textContent = hiscore;

function loadConfig() {
  const saved = localStorage.getItem("snakeNeonConfig");
  const base = JSON.parse(JSON.stringify(CONFIG));
  if (saved) {
    try {
      const s = JSON.parse(saved);
      delete s.fruits; delete s.colors; // estrutura visual sempre vem do CONFIG
      const savedColors = JSON.parse(saved).colors || {};
      Object.assign(base, s);
      if (savedColors.snakeBody) base.colors.snakeBody = savedColors.snakeBody;
    } catch (e) {}
  }
  return base;
}

// --- Sons retrô (Web Audio, sem arquivos externos) ---
let audioCtx;
function beep(freq, duration, type = "square", slideTo = null) {
  if (!cfg.soundEnabled) return;
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
  gain.gain.setValueAtTime(cfg.soundVolume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}
const SFX = {
  eat:      () => beep(440, 0.1, "square", 880),
  rare:     () => { beep(660, 0.07); setTimeout(() => beep(990, 0.1), 70); },
  powerup:  () => { beep(523, 0.08); setTimeout(() => beep(784, 0.08), 80); setTimeout(() => beep(1047, 0.12), 160); },
  gameover: () => beep(330, 0.6, "sawtooth", 55),
  start:    () => { beep(262, 0.08); setTimeout(() => beep(523, 0.12), 90); },
};

function applyCanvasSize() {
  canvas.width = canvas.height = cfg.gridSize * cfg.cellPx;
}

function resetGame() {
  const mid = Math.floor(cfg.gridSize / 2);
  snake = [];
  for (let i = 0; i < cfg.startLength; i++) snake.push({ x: mid - i, y: mid });
  prevSnake = snake.map(s => ({ ...s }));
  dir = { x: 1, y: 0 };
  nextDir = dir;
  growth = 0; score = 0; dead = false; effect = null; powerup = null;
  particles = []; shake = 0; deathFlash = 0;
  document.getElementById("score").textContent = 0;
  document.getElementById("powerupLabel").textContent = "";
  spawnObstacles();
  spawnFood();
  applyCanvasSize();
}

function spawnObstacles() {
  obstacles = [];
  if (!cfg.obstaclesEnabled) return;
  const mid = Math.floor(cfg.gridSize / 2);
  let tries = 0;
  while (obstacles.length < cfg.obstacleCount && tries < 500) {
    tries++;
    const p = { x: Math.floor(Math.random() * cfg.gridSize), y: Math.floor(Math.random() * cfg.gridSize),
                seed: Math.random() };
    if (p.y === mid) continue; // linha de nascimento da cobra fica livre
    if (snake.some(s => s.x === p.x && s.y === p.y)) continue;
    if (obstacles.some(o => o.x === p.x && o.y === p.y)) continue;
    obstacles.push(p);
  }
}

function randCell() {
  let p, tries = 0;
  do {
    p = { x: Math.floor(Math.random() * cfg.gridSize), y: Math.floor(Math.random() * cfg.gridSize) };
    tries++;
  } while (tries < 200 && (snake.some(s => s.x === p.x && s.y === p.y) ||
           obstacles.some(o => o.x === p.x && o.y === p.y) ||
           (food && food.x === p.x && food.y === p.y)));
  return p;
}

function pickFruit() {
  const total = cfg.fruits.reduce((a, f) => a + f.weight, 0);
  let r = Math.random() * total;
  for (const f of cfg.fruits) { r -= f.weight; if (r <= 0) return f; }
  return cfg.fruits[0];
}

function spawnFood() {
  food = { ...randCell(), fruit: pickFruit(), born: performance.now() };
  if (cfg.powerupsEnabled && !powerup && Math.random() < cfg.powerupChance) {
    const type = cfg.powerupTypes[Math.floor(Math.random() * cfg.powerupTypes.length)];
    powerup = { ...randCell(), type };
    powerupTimer = cfg.powerupLifetime;
  }
}

const POWER_INFO = {
  speed: { label: "⚡ VELOCIDADE", color: "#ffe000" },
  slow:  { label: "🐌 LENTIDÃO",  color: "#37b6ff" },
  bonus: { label: "★ +PONTOS",    color: "#ff45e0" },
  ghost: { label: "◌ FANTASMA",   color: "#e8f4ff" },
};

function burst(cx, cy, color, n = 14, speed = 140) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = speed * (0.4 + Math.random() * 0.8);
    particles.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                     life: 0.5 + Math.random() * 0.4, maxLife: 0.9, color,
                     size: 2 + Math.random() * 3 });
  }
}

function cellCenter(p) { return { x: (p.x + 0.5) * cfg.cellPx, y: (p.y + 0.5) * cfg.cellPx }; }

function step() {
  prevSnake = snake.map(s => ({ ...s }));
  dir = nextDir;
  let head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if (cfg.walls === "wrap") {
    head.x = (head.x + cfg.gridSize) % cfg.gridSize;
    head.y = (head.y + cfg.gridSize) % cfg.gridSize;
  } else if (head.x < 0 || head.y < 0 || head.x >= cfg.gridSize || head.y >= cfg.gridSize) {
    return gameOver();
  }

  const ghost = effect === "ghost";
  if (!ghost && snake.some((s, i) => i > 0 && s.x === head.x && s.y === head.y)) {
    return gameOver();
  }
  if (!ghost && obstacles.some(o => o.x === head.x && o.y === head.y)) {
    return gameOver();
  }

  snake.unshift(head);
  if (growth > 0) growth--;
  else snake.pop();

  if (head.x === food.x && head.y === food.y) {
    const fr = food.fruit;
    score += cfg.foodPoints * fr.mult;
    growth += cfg.growPerFood;
    const c = cellCenter(food);
    burst(c.x, c.y, FRUIT_COLORS[fr.kind] || "#ff4060", 10 + fr.mult * 4);
    floatText(c.x, c.y, "+" + cfg.foodPoints * fr.mult, FRUIT_COLORS[fr.kind] || "#fff");
    spawnFood();
    updateScore();
    fr.mult > 1 ? SFX.rare() : SFX.eat();
  }

  if (powerup && head.x === powerup.x && head.y === powerup.y) {
    const c = cellCenter(powerup);
    burst(c.x, c.y, POWER_INFO[powerup.type].color, 18);
    if (powerup.type === "bonus") {
      score += cfg.bonusPoints;
      updateScore();
      floatText(c.x, c.y, "+" + cfg.bonusPoints, POWER_INFO.bonus.color);
      flashLabel(POWER_INFO.bonus.label);
    } else {
      effect = powerup.type;
      effectTimer = cfg.powerupDuration;
      document.getElementById("powerupLabel").textContent = POWER_INFO[effect].label;
    }
    powerup = null;
    SFX.powerup();
  }
}

let floaters = [];
function floatText(x, y, text, color) {
  floaters.push({ x, y, text, color, life: 1 });
}

let flashTimeout;
function flashLabel(text) {
  const el = document.getElementById("powerupLabel");
  el.textContent = text;
  clearTimeout(flashTimeout);
  flashTimeout = setTimeout(() => { if (!effect) el.textContent = ""; }, 1500);
}

function updateScore() {
  document.getElementById("score").textContent = score;
  if (score > hiscore) {
    hiscore = score;
    localStorage.setItem("snakeNeonHiscore", hiscore);
    document.getElementById("hiscore").textContent = hiscore;
  }
}

function gameOver() {
  dead = true;
  running = false;
  shake = 14;
  deathFlash = 1;
  const c = cellCenter(snake[0]);
  burst(c.x, c.y, "#ff3050", 28, 220);
  SFX.gameover();
  document.getElementById("btnStart").textContent = "JOGAR DE NOVO (Espaço)";
}

function currentSpeed() {
  let s = cfg.speed;
  if (effect === "speed") s *= 1.7;
  if (effect === "slow") s *= 0.55;
  return s;
}

// --- Loop ---
function loop(t) {
  const dt = Math.min((t - lastTime) / 1000, 0.1);
  lastTime = t;
  if (running && !paused) {
    stepTimer += dt;
    stepInterval = 1 / currentSpeed();
    while (stepTimer >= stepInterval && running) { stepTimer -= stepInterval; step(); }
    if (effect) {
      effectTimer -= dt;
      if (effectTimer <= 0) { effect = null; document.getElementById("powerupLabel").textContent = ""; }
    }
    if (powerup) {
      powerupTimer -= dt;
      if (powerupTimer <= 0) powerup = null;
    }
  }
  // física dos efeitos visuais roda sempre
  particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt; });
  particles = particles.filter(p => p.life > 0);
  floaters.forEach(f => { f.y -= 36 * dt; f.life -= dt; });
  floaters = floaters.filter(f => f.life > 0);
  shake = Math.max(0, shake - 40 * dt);
  deathFlash = Math.max(0, deathFlash - 2.2 * dt);
  draw(t);
  requestAnimationFrame(loop);
}

/* ================= RENDERIZAÇÃO CARTOON ================= */

const FRUIT_COLORS = { apple: "#ff3b3b", cherry: "#e8174c", grape: "#a04ce8", golden: "#ffd33d" };

function shade(hex, amt) { // clareia (+) ou escurece (-) uma cor hex
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, (n >> 16) + amt));
  const g = Math.max(0, Math.min(255, ((n >> 8) & 255) + amt));
  const b = Math.max(0, Math.min(255, (n & 255) + amt));
  return `rgb(${r},${g},${b})`;
}

function interpPoint(cur, prev, f) {
  if (!prev || Math.abs(cur.x - prev.x) > 1 || Math.abs(cur.y - prev.y) > 1) return cellCenter(cur);
  return { x: ((prev.x + (cur.x - prev.x) * f) + 0.5) * cfg.cellPx,
           y: ((prev.y + (cur.y - prev.y) * f) + 0.5) * cfg.cellPx };
}

function snakePoints(f) {
  return snake.map((s, i) => interpPoint(s, prevSnake[i] || prevSnake[prevSnake.length - 1], f));
}

function drawSnake(t, f) {
  const pts = snakePoints(f);
  const cell = cfg.cellPx;
  const baseR = cell * 0.42;
  const ghostMode = effect === "ghost";
  ctx.save();
  if (ghostMode) ctx.globalAlpha = 0.55;

  // corpo: círculos com contorno, do rabo pra cabeça, afinando no rabo
  const body = cfg.colors.snakeBody;
  for (let i = pts.length - 1; i >= 1; i--) {
    const taper = 1 - 0.45 * (i / pts.length);
    const r = baseR * taper;
    const p = pts[i];
    ctx.beginPath(); ctx.arc(p.x, p.y, r + 2.5, 0, 7); ctx.fillStyle = shade(body, -90); ctx.fill();
  }
  for (let i = pts.length - 1; i >= 1; i--) {
    const taper = 1 - 0.45 * (i / pts.length);
    const r = baseR * taper;
    const p = pts[i];
    const g = ctx.createRadialGradient(p.x - r * 0.35, p.y - r * 0.35, r * 0.1, p.x, p.y, r);
    g.addColorStop(0, shade(body, 55));
    g.addColorStop(1, shade(body, -15));
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.fillStyle = g; ctx.fill();
    // barriga listrada
    if (i % 2 === 0) {
      ctx.beginPath(); ctx.arc(p.x, p.y + r * 0.25, r * 0.5, 0, 7);
      ctx.fillStyle = cfg.colors.snakeBelly; ctx.globalAlpha = (ghostMode ? 0.55 : 1) * 0.7; ctx.fill();
      ctx.globalAlpha = ghostMode ? 0.55 : 1;
    }
  }

  // cabeça
  const h = pts[0];
  const hr = baseR * 1.22;
  const dx = dir.x, dy = dir.y;
  // língua bifurcada (pisca de tempos em tempos)
  if (Math.floor(t / 900) % 3 === 0 && (t % 900) < 350 && !dead) {
    const tl = hr * (1.1 + 0.4 * Math.sin(t / 40));
    const tipX = h.x + dx * (hr + tl), tipY = h.y + dy * (hr + tl);
    ctx.strokeStyle = "#ff2050"; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(h.x + dx * hr * 0.8, h.y + dy * hr * 0.8); ctx.lineTo(tipX, tipY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(tipX, tipY); ctx.lineTo(tipX + (dy - dx * 0.5) * 5, tipY + (-dx - dy * 0.5) * 5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(tipX, tipY); ctx.lineTo(tipX + (-dy - dx * 0.5) * 5, tipY + (dx - dy * 0.5) * 5); ctx.stroke();
  }
  // contorno + crânio
  ctx.beginPath(); ctx.ellipse(h.x, h.y, hr + 2.5, hr * 0.88 + 2.5, Math.atan2(dy, dx), 0, 7);
  ctx.fillStyle = shade(body, -90); ctx.fill();
  const hg = ctx.createRadialGradient(h.x - hr * 0.3, h.y - hr * 0.3, hr * 0.1, h.x, h.y, hr);
  hg.addColorStop(0, shade(body, 70));
  hg.addColorStop(1, shade(body, -5));
  ctx.beginPath(); ctx.ellipse(h.x, h.y, hr, hr * 0.88, Math.atan2(dy, dx), 0, 7);
  ctx.fillStyle = hg; ctx.fill();

  // olhos grandes de cartoon (perpendiculares à direção)
  const px = -dy, py = dx; // vetor perpendicular
  const eyeOff = hr * 0.45, eyeFwd = hr * 0.25;
  const er = hr * 0.38;
  for (const side of [1, -1]) {
    const ex = h.x + dx * eyeFwd + px * eyeOff * side;
    const ey = h.y + dy * eyeFwd + py * eyeOff * side;
    ctx.beginPath(); ctx.arc(ex, ey, er, 0, 7); ctx.fillStyle = "#fff"; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = shade(body, -90); ctx.stroke();
    const blink = (Math.floor(t / 2600) % 2 === 0 && (t % 2600) < 120);
    if (blink) {
      ctx.beginPath(); ctx.arc(ex, ey, er, 0, 7); ctx.fillStyle = shade(body, 20); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(ex + dx * er * 0.4, ey + dy * er * 0.4, er * 0.5, 0, 7);
      ctx.fillStyle = "#1a1a2a"; ctx.fill();
      ctx.beginPath(); ctx.arc(ex + dx * er * 0.4 - er * 0.18, ey + dy * er * 0.4 - er * 0.18, er * 0.15, 0, 7);
      ctx.fillStyle = "#fff"; ctx.fill();
    }
  }
  ctx.restore();
}

// --- Frutas (vetoriais, com pulso e brilho) ---
function drawFruit(t) {
  if (!food) return;
  const c = cellCenter(food);
  const pulse = 1 + 0.1 * Math.sin((t - food.born) / 180);
  const s = cfg.cellPx * 0.5 * pulse;
  const kind = food.fruit.kind;
  const col = FRUIT_COLORS[kind];

  // halo chamativo
  ctx.save();
  ctx.shadowColor = col; ctx.shadowBlur = 18;
  ctx.globalAlpha = 0.25 + 0.15 * Math.sin(t / 200);
  ctx.beginPath(); ctx.arc(c.x, c.y, s * 1.5, 0, 7); ctx.fillStyle = col; ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.shadowColor = col; ctx.shadowBlur = 10;

  if (kind === "cherry") {
    for (const off of [-0.4, 0.45]) {
      grad(off * s, s * 0.25, s * 0.55, col);
      stem(off * s, s * 0.25 - s * 0.5, 0, -s);
    }
  } else if (kind === "grape") {
    const pos = [[0,-0.45],[-0.45,0.1],[0.45,0.1],[0,0.55],[-0.22,-0.18],[0.22,-0.18]];
    for (const [gx, gy] of pos) grad(gx * s, gy * s, s * 0.42, col);
    stem(0, -s * 0.85, 0, -s * 0.5);
  } else if (kind === "golden") {
    // fruta dourada com raios girando
    ctx.rotate(t / 700);
    ctx.fillStyle = "#fff6c0";
    for (let i = 0; i < 6; i++) {
      ctx.rotate(Math.PI / 3);
      ctx.fillRect(s * 1.05, -1.5, s * 0.5, 3);
    }
    ctx.rotate(-t / 700);
    grad(0, 0, s * 0.85, col);
    sparkle(-s * 0.3, -s * 0.3, s * 0.3, t);
  } else { // maçã
    grad(0, s * 0.08, s * 0.85, col);
    leaf(s * 0.15, -s * 0.75, s * 0.45);
    stem(0, -s * 0.6, 0, -s * 0.45);
  }
  ctx.restore();

  function grad(x, y, r, color) {
    const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
    g.addColorStop(0, shade(color, 80));
    g.addColorStop(1, shade(color, -30));
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = shade(color, -80); ctx.stroke();
    // brilho cartoon
    ctx.beginPath(); ctx.ellipse(x - r * 0.35, y - r * 0.4, r * 0.22, r * 0.13, -0.6, 0, 7);
    ctx.fillStyle = "rgba(255,255,255,.8)"; ctx.fill();
  }
  function stem(x, y, dx2, dy2) {
    ctx.strokeStyle = "#7a4a20"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + dx2 * 0.5 + 3, y + dy2 * 0.6, x + dx2, y + dy2); ctx.stroke();
  }
  function leaf(x, y, r) {
    ctx.beginPath(); ctx.ellipse(x + r * 0.5, y, r, r * 0.45, -0.5, 0, 7);
    ctx.fillStyle = "#3dbb45"; ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = "#1d7a26"; ctx.stroke();
  }
  function sparkle(x, y, r, tt) {
    const a = 0.6 + 0.4 * Math.sin(tt / 150);
    ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x - r, y); ctx.lineTo(x + r, y);
    ctx.moveTo(x, y - r); ctx.lineTo(x, y + r); ctx.stroke(); ctx.restore();
  }
}

// --- Power-ups com ícones de verdade ---
function drawPowerup(t) {
  if (!powerup) return;
  const c = cellCenter(powerup);
  const bob = Math.sin(t / 250) * 3;
  const s = cfg.cellPx * 0.5;
  const info = POWER_INFO[powerup.type];
  const fading = powerupTimer < 2 && Math.floor(t / 150) % 2 === 0; // pisca quando vai sumir

  ctx.save();
  ctx.translate(c.x, c.y + bob);
  if (fading) ctx.globalAlpha = 0.35;

  // anel pulsante
  ctx.strokeStyle = info.color;
  ctx.lineWidth = 2;
  ctx.shadowColor = info.color; ctx.shadowBlur = 14;
  ctx.globalAlpha *= 0.9;
  ctx.beginPath(); ctx.arc(0, 0, s * (1.15 + 0.1 * Math.sin(t / 180)), 0, 7); ctx.stroke();

  // medalhão de fundo
  const bg = ctx.createRadialGradient(0, -s * 0.3, s * 0.1, 0, 0, s);
  bg.addColorStop(0, "rgba(255,255,255,.25)");
  bg.addColorStop(1, "rgba(0,0,0,.55)");
  ctx.beginPath(); ctx.arc(0, 0, s, 0, 7); ctx.fillStyle = bg; ctx.fill();

  ctx.fillStyle = info.color;
  ctx.strokeStyle = shade(info.color.length === 7 ? info.color : "#ffffff", -70);
  ctx.lineWidth = 1.5;

  if (powerup.type === "speed") {        // raio ⚡
    ctx.beginPath();
    ctx.moveTo(s*0.15, -s*0.65); ctx.lineTo(-s*0.35, s*0.1); ctx.lineTo(-s*0.02, s*0.1);
    ctx.lineTo(-s*0.15, s*0.65); ctx.lineTo(s*0.38, -s*0.12); ctx.lineTo(s*0.02, -s*0.12);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if (powerup.type === "slow") {  // caracol 🐌
    ctx.beginPath();                      // concha espiral
    for (let a = 0; a < Math.PI * 4.5; a += 0.15) {
      const r = s * 0.55 * a / (Math.PI * 4.5);
      const x = Math.cos(a) * r + s * 0.12, y = Math.sin(a) * r - s * 0.1;
      a === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.lineWidth = 3; ctx.strokeStyle = info.color; ctx.stroke();
    ctx.lineWidth = 2.5; ctx.lineCap = "round";       // corpo e antenas
    ctx.beginPath(); ctx.moveTo(-s*0.55, s*0.42); ctx.quadraticCurveTo(-s*0.6, s*0.1, -s*0.45, -s*0.05);
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s*0.45, -s*0.05); ctx.lineTo(-s*0.6, -s*0.35); ctx.moveTo(-s*0.45, -s*0.05); ctx.lineTo(-s*0.3, -s*0.4); ctx.stroke();
  } else if (powerup.type === "bonus") { // estrela ★
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 === 0 ? s * 0.7 : s * 0.3;
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if (powerup.type === "ghost") { // fantasminha ◌
    ctx.beginPath();
    ctx.arc(0, -s*0.1, s*0.5, Math.PI, 0);
    ctx.lineTo(s*0.5, s*0.5);
    for (let i = 0; i < 3; i++) ctx.arc(s*0.5 - s*(i*2+1)/3, s*0.5, s/6, 0, Math.PI);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#1a1a2a";            // olhinhos
    ctx.beginPath(); ctx.arc(-s*0.18, -s*0.12, s*0.1, 0, 7); ctx.arc(s*0.18, -s*0.12, s*0.1, 0, 7); ctx.fill();
  }
  ctx.restore();
}

// --- Pedras (obstáculos) ---
function drawObstacles() {
  const cell = cfg.cellPx;
  for (const o of obstacles) {
    const cx = (o.x + 0.5) * cell, cy = (o.y + 0.5) * cell;
    const r = cell * 0.44;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(o.seed * 6.28);
    // blob irregular de pedra
    ctx.beginPath();
    for (let i = 0; i <= 8; i++) {
      const a = i / 8 * Math.PI * 2;
      const rr = r * (0.82 + 0.18 * Math.sin(a * 3 + o.seed * 10));
      const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    const g = ctx.createRadialGradient(-r * 0.3, -r * 0.4, r * 0.1, 0, 0, r);
    g.addColorStop(0, shade(cfg.colors.obstacle, 40));
    g.addColorStop(1, shade(cfg.colors.obstacle, -45));
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = shade(cfg.colors.obstacle, -85); ctx.stroke();
    // rachaduras
    ctx.lineWidth = 1; ctx.strokeStyle = shade(cfg.colors.obstacle, -60);
    ctx.beginPath(); ctx.moveTo(-r * 0.3, -r * 0.1); ctx.lineTo(0, r * 0.15); ctx.lineTo(r * 0.35, r * 0.05); ctx.stroke();
    ctx.restore();
  }
}

function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // tremida de tela
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  // tabuleiro xadrez sutil
  const cell = cfg.cellPx;
  for (let y = 0; y < cfg.gridSize; y++)
    for (let x = 0; x < cfg.gridSize; x++)
      if ((x + y) % 2 === 0) {
        ctx.fillStyle = "rgba(255,255,255,.025)";
        ctx.fillRect(x * cell, y * cell, cell, cell);
      }

  drawObstacles();
  drawFruit(t);
  drawPowerup(t);

  if (snake) {
    const f = running && !paused ? Math.min(stepTimer / stepInterval, 1) : 1;
    drawSnake(t, f);
  }

  // partículas
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // textos flutuantes (+10 etc.)
  for (const fl of floaters) {
    ctx.globalAlpha = Math.max(0, fl.life);
    ctx.fillStyle = fl.color;
    ctx.font = `bold ${Math.floor(cell * 0.7)}px 'Courier New'`;
    ctx.textAlign = "center";
    ctx.shadowColor = fl.color; ctx.shadowBlur = 8;
    ctx.fillText(fl.text, fl.x, fl.y);
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;

  // flash vermelho na morte
  if (deathFlash > 0) {
    ctx.fillStyle = `rgba(255,30,60,${deathFlash * 0.25})`;
    ctx.fillRect(-20, -20, canvas.width + 40, canvas.height + 40);
  }

  if (dead) overlayText("GAME OVER", "#f06", `Pontos: ${score} · Espaço para reiniciar`);
  else if (!running) overlayText("SNAKE NEON", "#0ff", "Espaço para começar");
  else if (paused) overlayText("PAUSA", "#ff0", "Espaço para continuar");
}

function overlayText(title, color, sub) {
  ctx.fillStyle = "rgba(5,5,10,.72)";
  ctx.fillRect(-20, -20, canvas.width + 40, canvas.height + 40);
  ctx.textAlign = "center";
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 24;
  ctx.font = `bold ${Math.floor(canvas.width / 11)}px 'Courier New'`;
  ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 10);
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#bbb";
  ctx.font = `${Math.floor(canvas.width / 28)}px 'Courier New'`;
  ctx.fillText(sub, canvas.width / 2, canvas.height / 2 + 32);
}

// --- Input ---
const KEYS = {
  ArrowUp: {x:0,y:-1}, ArrowDown: {x:0,y:1}, ArrowLeft: {x:-1,y:0}, ArrowRight: {x:1,y:0},
  w: {x:0,y:-1}, s: {x:0,y:1}, a: {x:-1,y:0}, d: {x:1,y:0},
};
document.addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); toggleStart(); return; }
  if (e.key.toLowerCase() === "m") { toggleMenu(); return; }
  const d = KEYS[e.key] || KEYS[e.key.toLowerCase()];
  if (d && running && !paused) {
    if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
    e.preventDefault();
  }
});

// --- Swipe (celular): deslizar muda a direção, toque rápido inicia/pausa ---
let touchStart = null;
canvas.addEventListener("touchstart", e => {
  touchStart = [e.touches[0].clientX, e.touches[0].clientY];
  e.preventDefault();
}, { passive: false });
canvas.addEventListener("touchend", e => {
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart[0];
  const dy = e.changedTouches[0].clientY - touchStart[1];
  touchStart = null;
  e.preventDefault();
  if (Math.hypot(dx, dy) < 24) { toggleStart(); return; } // tap = espaço
  const d = Math.abs(dx) > Math.abs(dy) ? { x: Math.sign(dx), y: 0 } : { x: 0, y: Math.sign(dy) };
  if (running && !paused && (d.x !== -dir.x || d.y !== -dir.y)) nextDir = d;
}, { passive: false });

function toggleStart() {
  if (dead || !snake) { resetGame(); running = true; paused = false; SFX.start(); }
  else if (!running) { running = true; paused = false; SFX.start(); }
  else paused = !paused;
  document.getElementById("btnStart").textContent = paused ? "CONTINUAR (Espaço)" : "PAUSA (Espaço)";
}
document.getElementById("btnStart").addEventListener("click", toggleStart);

// --- Menu de opções ---
const menu = document.getElementById("menu");
const $ = id => document.getElementById(id);

function toggleMenu() {
  const open = menu.style.display !== "flex";
  menu.style.display = open ? "flex" : "none";
  if (open) { paused = true; fillMenu(); }
}
function fillMenu() {
  $("optSpeed").value = cfg.speed; $("optSpeedVal").textContent = cfg.speed;
  $("optGrid").value = cfg.gridSize; $("optGridVal").textContent = cfg.gridSize;
  $("optWalls").value = cfg.walls;
  $("optSound").value = String(cfg.soundEnabled);
  $("optObstacles").value = String(cfg.obstaclesEnabled);
  $("optObstacleCount").value = cfg.obstacleCount; $("optObstacleCountVal").textContent = cfg.obstacleCount;
  $("optPowerups").value = String(cfg.powerupsEnabled);
  $("optPowerChance").value = Math.round(cfg.powerupChance * 100);
  $("optPowerChanceVal").textContent = Math.round(cfg.powerupChance * 100) + "%";
  $("optSnakeColor").value = cfg.colors.snakeBody;
  $("optStartLen").value = cfg.startLength;
}
$("optSpeed").addEventListener("input", e => $("optSpeedVal").textContent = e.target.value);
$("optGrid").addEventListener("input", e => $("optGridVal").textContent = e.target.value);
$("optPowerChance").addEventListener("input", e => $("optPowerChanceVal").textContent = e.target.value + "%");
$("optObstacleCount").addEventListener("input", e => $("optObstacleCountVal").textContent = e.target.value);

$("btnSave").addEventListener("click", () => {
  cfg.speed = +$("optSpeed").value;
  cfg.gridSize = +$("optGrid").value;
  cfg.walls = $("optWalls").value;
  cfg.soundEnabled = $("optSound").value === "true";
  cfg.obstaclesEnabled = $("optObstacles").value === "true";
  cfg.obstacleCount = +$("optObstacleCount").value;
  cfg.powerupsEnabled = $("optPowerups").value === "true";
  cfg.powerupChance = +$("optPowerChance").value / 100;
  cfg.colors.snakeBody = $("optSnakeColor").value;
  cfg.startLength = Math.max(1, +$("optStartLen").value || 3);
  localStorage.setItem("snakeNeonConfig", JSON.stringify(cfg));
  toggleMenu();
  resetGame(); running = false;
});
$("btnReset").addEventListener("click", () => {
  localStorage.removeItem("snakeNeonConfig");
  cfg = loadConfig();
  fillMenu();
  resetGame(); running = false;
});
$("btnClose").addEventListener("click", toggleMenu);
$("btnMenu").addEventListener("click", toggleMenu);

// --- Início ---
resetGame();
running = false;
requestAnimationFrame(t => { lastTime = t; requestAnimationFrame(loop); });
</script>
</body>
